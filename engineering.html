<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leon Trajkovski | Biomedical Engineering Portfolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d0d; color: #e8e8e8; font-family: 'Georgia', serif; }
  
  /* HEADER STYLES */
  header { 
    padding: 80px 40px 50px; 
    border-bottom: 1px solid #1a1a1a; 
    max-width: 1200px;
    margin: 0 auto;
  }
  .header-content {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .header-text { flex: 1; }
  header h1 { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 2.2rem; 
    font-weight: 300; 
    letter-spacing: 5px; 
    color: #ffffff; 
  }
  header p { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin-top: 12px; 
    color: #666; 
    font-size: 0.85rem; 
    letter-spacing: 2px; 
    text-transform: uppercase;
  }

  /* BACK BUTTON NAVIGATION */
  .back-btn {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.8rem;
    color: #555;
    text-decoration: none;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid #222;
    padding: 10px 18px;
    border-radius: 4px;
    transition: all 0.3s ease;
  }
  .back-btn:hover {
    color: #bfa38a;
    border-color: #bfa38a;
    background: rgba(191, 163, 138, 0.03);
  }
  
  /* Main layout split */
  .portfolio-container { position: relative; max-width: 1200px; margin: 0 auto; display: flex; }
  .feed { flex: 1; max-width: 960px; padding: 0 40px; margin: 0 auto; }
  
  /* Shared structural classes for future project injections */
  .project { margin: 60px auto; scroll-margin-top: 80px; }
  .project h2 { font-size: 1.4rem; font-weight: normal; color: #bfa38a; margin-bottom: 8px; }
  .project .meta { font-size: 0.8rem; color: #555; margin-bottom: 20px; letter-spacing: 1px; text-transform: uppercase; }
  .project p { line-height: 1.8; color: #bbb; margin-bottom: 24px; font-size: 0.95rem; }
  
  .filled-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .filled-grid img { width: 100%; height: 450px; object-fit: cover; border-radius: 4px; border: 1px solid #1a1a1a; cursor: pointer; transition: border-color 0.3s, transform 0.2s; }
  .filled-grid img:hover { border-color: #bfa38a; }

  .images { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .images img, .zoomable-img { width: 100%; border-radius: 4px; border: 1px solid #1a1a1a; cursor: pointer; transition: border-color 0.3s, transform 0.2s; }
  .images img:hover, .zoomable-img:hover { border-color: #bfa38a; }
  
  .full-width { width: 100%; border-radius: 4px; border: 1px solid #1a1a1a; margin-bottom: 24px; display: block; }
  video { width: 100%; border-radius: 4px; margin-bottom: 24px; border: 1px solid #1a1a1a; display: block; }
  
  .finding { background: #111; border-left: 3px solid #bfa38a; padding: 16px 20px; border-radius: 0 4px 4px 0; margin-bottom: 24px; }
  .finding p { color: #ccc; margin: 0; font-size: 0.9rem; font-style: italic; }
  
  footer { border-top: 1px solid #222; padding: 40px; text-align: center; color: #444; font-size: 0.8rem; }

  /* Lightbox Styles */
  .lightbox-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5, 5, 5, 0.95); display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1000;
  }
  .lightbox-overlay.active { opacity: 1; pointer-events: auto; }
  .lightbox-container { position: relative; max-width: 90%; max-height: 90%; overflow: hidden; border-radius: 4px; }
  .lightbox-img { max-width: 100%; max-height: 85vh; object-fit: contain; transition: transform 0.2s ease; cursor: zoom-in; display: block; }
  .lightbox-img.zoomed { transform: scale(2); cursor: zoom-out; }
  .lightbox-close { position: absolute; top: 20px; right: 20px; color: #888; font-size: 1.5rem; cursor: pointer; font-family: sans-serif; transition: color 0.2s; }
  .lightbox-close:hover { color: #fff; }

  @media (max-width: 1024px) { .feed { max-width: 100%; } }
  @media (max-width: 768px) {
    .header-content { flex-direction: column; gap: 20px; }
    .back-btn { align-self: flex-start; }
    .filled-grid { grid-template-columns: 1fr; }
    .filled-grid img { height: 350px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="header-text">
      <h1>LEON TRAJKOVSKI</h1>
      <p>Biomedical Engineering · Parametric CAD · Finite Element Analysis</p>
    </div>
    <a href="index.html" class="back-btn">← Back to Hub</a>
  </div>
</header>

<div class="portfolio-container">
  <div class="feed">
    </div>
</div>
 
<footer>
  Leon Trajkovski · leontrajkovski9@gmail.com · Built with HTML & CSS
</footer>

<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox(event)">
  <span class="lightbox-close">&times;</span>
  <div class="lightbox-container">
    <img class="lightbox-img" id="lightbox-target" src="" alt="Enlarged view" onclick="toggleZoom(event)">
  </div>
</div>

<script>
  // Lightbox Logic
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-target');

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(e) {
    if (e.target === lightbox || e.target.classList.contains('lightbox-close')) {
      lightbox.classList.remove('active');
      lightboxImg.classList.remove('zoomed');
      document.body.style.overflow = '';
    }
  }

  function toggleZoom(e) {
    e.stopPropagation();
    lightboxImg.classList.toggle('zoomed');
    if (lightboxImg.classList.contains('zoomed')) {
      lightbox.onmousemove = (moveEvent) => {
        const x = (moveEvent.clientX / window.innerWidth) * 100;
        const y = (moveEvent.clientY / window.innerHeight) * 100;
        lightboxImg.style.transformOrigin = `${x}% ${y}%`;
      };
    } else {
      lightbox.onmousemove = null;
    }
  }
</script>

</body>
</html>
